<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>자산 목표</title>
<meta name="description" content="목표 나이·목표 금액과 내 자산을 비교하고 매주 기록하는 앱">
<meta name="theme-color" content="#0A0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="자산">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css?v=2.0.0">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-dot"></span><span class="brand-name">자산 목표</span></div>
      <button class="icon-btn" id="btnSettings" aria-label="설정">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9.5a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="content">

    <!-- ═══════════ 홈 ═══════════ -->
    <section class="tab-panel is-active" id="panel-home">

      <section class="hero">
        <div class="hero-label">현재 순자산</div>
        <div class="hero-value" id="heroNet">—</div>
        <div class="hero-sub">
          <span class="chip">자산 <b id="heroAssets">—</b></span>
          <span class="chip chip-debt">부채 <b id="heroDebts">—</b></span>
        </div>
      </section>

      <div class="card goal-card">
        <div class="goal-top">
          <div>
            <div class="goal-cap">목표</div>
            <div class="goal-line" id="goalLine">—</div>
          </div>
          <button class="btn-ghost" id="btnEditGoal">수정</button>
        </div>
        <div class="meter"><div class="meter-fill" id="goalFill"></div></div>
        <div class="goal-pct"><b id="goalPct">—</b><span id="goalLeft"></span></div>
      </div>

      <div class="stat-grid" id="statGrid"></div>

      <div class="card card-chart">
        <div class="chart-head">
          <h3>목표 대비 내 자산</h3>
          <div class="seg" id="segRange">
            <button data-v="goal" class="is-on">목표까지</button>
            <button data-v="year">최근 1년</button>
          </div>
          <div class="chart-legend" id="legendMain"></div>
        </div>
        <div class="chart-box"><svg id="chartMain" class="chart"></svg></div>
        <div class="readout" id="readoutMain"></div>
      </div>

      <div class="week-banner" id="weekBanner"></div>
    </section>

    <!-- ═══════════ 자산 ═══════════ -->
    <section class="tab-panel" id="panel-assets">
      <div class="sum-card">
        <div class="sum-row"><span>자산 합계</span><b id="sumAssets">—</b></div>
        <div class="sum-row"><span>부채 합계</span><b class="neg" id="sumDebts">—</b></div>
        <div class="sum-row total"><span>순자산</span><b id="sumNet">—</b></div>
      </div>

      <button class="btn-primary btn-wide" id="btnCaptureAll">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
        캡처로 한 번에 입력
      </button>

      <div class="section-head"><h2>내 자산</h2><button class="btn-ghost" id="btnAddAsset">+ 추가</button></div>
      <div class="card-list" id="assetList"></div>

      <div class="section-head"><h2>대출 · 부채</h2><button class="btn-ghost" id="btnAddDebt">+ 추가</button></div>
      <div class="card-list" id="debtList"></div>
    </section>

    <!-- ═══════════ 기록 ═══════════ -->
    <section class="tab-panel" id="panel-records">
      <div id="weekBanner2"></div>
      <div class="section-head"><h2>주간 기록</h2><span class="count" id="recCount"></span></div>
      <div class="card-list" id="recordList"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab is-active" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M6 10v10h12V10"/></svg><span>홈</span>
    </button>
    <button class="tab" data-tab="assets">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>자산</span>
    </button>
    <button class="tab" data-tab="records">
      <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3 4v4h4"/></svg><span>기록</span>
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet">
    <div class="sheet-grab"></div>
    <h3 id="sheetTitle"></h3>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="btn-row" id="sheetActions"></div>
  </div>
</div>

<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script src="assets/chart.js?v=2.0.0"></script>
<script src="assets/ocr.js?v=2.0.0"></script>
<script src="assets/app.js?v=2.0.0"></script>
</body>
</html>
